spring:
  application:
    name: bird-platform
  task:
    scheduling:
      # One thread per @Scheduled poller (outbox relay, notification dispatch, eBird dispatch) so a
      # poller that backs off on retries never stalls the others on a shared single scheduler thread.
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/bird_platform
    username: bird_platform
    password: bird_platform
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/shared
      - classpath:db/migration/identity
      - classpath:db/migration/observations
      - classpath:db/migration/bookings
      - classpath:db/migration/permits
      - classpath:db/migration/surveys
      - classpath:db/migration/notifications
      - classpath:db/migration/ebird
      - classpath:db/migration/expeditions
  elasticsearch:
    uris: http://localhost:9200

bird:
  outbox:
    # How often the OutboxPoller drains the outbox into the read-model projections.
    poll-delay-ms: 1000
  ebird:
    # How often the dispatcher pushes pending sightings to eBird.
    dispatch-delay-ms: 2000
    # Dead-letter a submission after this many real (non-circuit-open) failed attempts.
    max-attempts: 5
    circuit:
      # Consecutive failed calls before the breaker opens, and how long it stays open before probing.
      failure-threshold: 3
      reset-timeout-ms: 10000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
